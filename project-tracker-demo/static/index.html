<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>项目进度台账</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="mast">
      <div class="wrap navline">
        <a class="brand" href="/">
          <svg aria-hidden="true" viewBox="0 0 32 32" width="30" height="30">
            <rect
              x="1"
              y="2"
              width="30"
              height="28"
              rx="6"
              fill="currentColor"
            />
            <g stroke="white" stroke-width="2.5" stroke-linecap="round">
              <path d="M7 10h9m-5 6h12m-6 6h8" />
            </g>
          </svg>
          项目进度台账</a
        ><button id="sync-open" class="utility">飞书同步</button>
      </div>
    </header>
    <main class="wrap">
      <section class="intro">
        <div>
          <h1>项目总览</h1>
          <p id="summary" aria-live="polite">正在读取项目…</p>
        </div>
        <div class="overview" id="overview" aria-label="项目按阶段分布"></div>
      </section>
      <section aria-label="项目列表">
        <div class="filters">
          <label>阶段<select id="stage" aria-label="筛选阶段"></select></label>
          <label
            >负责人<select id="owner" aria-label="筛选负责人"></select
          ></label>
          <label>风险<select id="risk" aria-label="筛选风险"></select></label>
          <button class="clear" id="clear" hidden>清除筛选</button
          ><span id="row-count"></span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>项目 / 负责人</th>
                <th>阶段 / 完成度</th>
                <th>下一里程碑 / 日期</th>
                <th>风险</th>
                <th>下一步</th>
                <th>正式版本 / 最近发布</th>
              </tr>
            </thead>
            <tbody id="list"></tbody>
          </table>
        </div>
        <p id="empty" hidden>没有符合条件的项目。可清除筛选查看全部项目。</p>
      </section>
    </main>
    <dialog id="detail-dialog">
      <article>
        <div class="dialog-top">
          <div>
            <small id="detail-id"></small>
            <h2 id="detail-name"></h2>
          </div>
          <button class="close" aria-label="关闭项目详情">关闭</button>
        </div>
        <nav class="tabs" aria-label="项目详情">
          <button data-view="info">项目进度</button
          ><button data-view="releases">发布历史</button
          ><button data-view="changes">变更记录</button>
        </nav>
        <div id="detail-body"></div>
        <p id="detail-msg" role="status"></p>
      </article>
    </dialog>
    <dialog id="sync-dialog">
      <article>
        <div class="dialog-top">
          <h2>飞书多维表格</h2>
          <button class="close" aria-label="关闭飞书同步">关闭</button>
        </div>
        <div id="sync-body"></div>
        <p id="sync-msg" role="status"></p>
      </article>
    </dialog>
    <p class="notice" id="notice" role="status" hidden></p>
    <script src="/static/app.js" defer></script>
  </body>
</html>
